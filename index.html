<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Golf Accessories</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f4f4;
    color:#333;
}

/* HEADER */

header{
    background:#0a5c2f;
    color:white;
    padding:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.nav-links a:hover{
    text-decoration:underline;
}

.search-container{
    text-align:center;
    margin-top:15px;
}

.search-container input{
    width:300px;
    max-width:90%;
    padding:10px;
    border:none;
    border-radius:25px;
}

/* HERO */

.hero{
    background:
    linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.45)
    ),
    url('https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=1600&q=80');

    background-size:cover;
    background-position:center;
    height:550px;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero-content{
    color:white;
    padding:20px;
}

.hero-content h1{
    font-size:3.5rem;
}

.hero-content p{
    margin-top:15px;
    font-size:1.2rem;
}

.shop-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    background:#ffd700;
    color:black;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.shop-btn:hover{
    background:#e8c400;
}

/* ABOUT */

.about{
    background:white;
    padding:60px 8%;
    text-align:center;
}

.about h2{
    color:#0a5c2f;
    margin-bottom:20px;
}

/* BENEFITS */

.benefits{
    background:#eef7ef;
    padding:60px 8%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    text-align:center;
}

.benefits i{
    font-size:40px;
    color:#0a5c2f;
    margin-bottom:15px;
}

/* PRODUCTS */

.products{
    padding:60px 8%;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
    color:#0a5c2f;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.product-card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-8px);
}

.product-card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.product-info{
    padding:15px;
}

.product-info h3{
    margin-bottom:10px;
}

.rating{
    color:#ffb400;
    margin-bottom:10px;
}

.price{
    color:#0a5c2f;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.buy-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#0a5c2f;
    color:white;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
}

.buy-btn:hover{
    background:#084521;
}

/* CART */

.cart-section{
    width:90%;
    max-width:800px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,.15);
}

.cart-section h2{
    color:#0a5c2f;
    margin-bottom:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px
