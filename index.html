<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate by Mayra Escalante</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
}

/* HEADER */
.header{
    background:#d6e2e8;
    padding:20px;
    position:relative;
    text-align:center;
}

.profile-card{
    position:absolute;
    left:20px;
    top:15px;
    width:140px;
    height:140px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.profile-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.social-icons{
    display:flex;
    justify-content:center;
    gap:50px;
    margin-bottom:25px;
}

.social-icons a{
    color:black;
    font-size:30px;
    transition:.3s;
}

.social-icons a:hover{
    transform:scale(1.1);
}

.header h1{
    font-size:28px;
    margin-bottom:30px;
}

.header h2{
    font-size:22px;
    margin-bottom:30px;
}

.about-btn{
    background:black;
    color:white;
    text-decoration:none;
    padding:8px 25px;
    border-radius:10px;
    font-size:18px;
    display:inline-block;
}

.contact-btn{
    position:absolute;
    right:70px;
    top:115px;
    background:black;
    color:white;
    padding:18px 25px;
    text-decoration:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

/* HERO SECTION */
.hero{
    height:700px;
    background:url('house.jpg') center center/cover no-repeat;
    position:relative;
}

.overlay-text{
    position:absolute;
    bottom:40px;
    left:40px;
    color:white;
}

.overlay-text h2{
    font-size:60px;
    font-weight:900;
    line-height:1.1;
}

/* RESPONSIVE */
@media(max-width:900px){

    .profile-card{
        position:static;
        margin:0 auto 20px;
    }

    .contact-btn{
        position:static;
        display:inline-block;
        margin-top:20px;
    }

    .social-icons{
        gap:25px;
    }

    .overlay-text h2{
        font-size:38px;
    }

    .hero{
        height:500px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="profile-card">
        <img src="profile.jpg" alt="Mayra Escalante">
    </div>

    <div class="social-icons">
        <a href="#"><i class="fab fa-facebook-square"></i></a>
        <a href="#"><i class="fab fa-instagram-square"></i></a>
        <a href="#"><i class="fab fa-twitter-square"></i></a>
        <a href="#"><i class="fab fa-linkedin"></i></a>
    </div>

    <h1>Real Estate by Mayra Escalante</h1>

    <h2>Welcome to my page.</h2>

    <a href="#about" class="about-btn">About Me</a>

    <a href="#contact" class="contact-btn">CONTACT ME</a>

</header>

<section class="hero">

    <div class="overlay-text">
        <h2>
            REAL ESTATE<br>
            WITH REAL RESULTS.
        </h2>
    </div>

</section>

</body>
</html>
